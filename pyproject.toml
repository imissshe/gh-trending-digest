[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-trending-digest"
version = "0.1.0"
description = "Fetch GitHub Trending and save it as Markdown or JSON (stdlib only)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
trending-digest = "trending_digest.cli:main"

[tool.setuptools]
packages = ["trending_digest"]
